<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Караван</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=PT+Mono&family=Libre+Baskerville:wght@700&family=Cinzel:wght@700&family=Permanent+Marker&family=Comfortaa:wght@500&display=swap">
<style>
:root{
  --bg:#120e08;--panel:#1d170c;--amber:#ffb642;--dim:rgba(255,182,66,.66);--line:rgba(255,182,66,.34);--paper:#e4d6ae;--ink:#1a1712;--blood:#9a2a1c;--warn:#ff7a5c;
  --ch:clamp(58px,13.5dvh,104px);--cw:min(calc(var(--ch)*.714),26vw);--strip:calc(var(--ch)*.27);--hw:clamp(40px,10dvh,62px);--hp:calc(var(--hw)*.44);--ix:15px;--sc:20px;--side:clamp(190px,25vw,290px);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
}
@media (min-width:700px) and (min-height:650px){:root{--ch:clamp(96px,14.5dvh,160px);--cw:calc(var(--ch)*.714);--hw:clamp(72px,11dvh,108px);--ix:21px;--sc:28px}body{font-size:16px!important}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0b06}}
:root[data-theme="dark"]{--bg:#0f0b06}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{background:var(--bg) radial-gradient(ellipse at 50% 35%,#2b2110 0,transparent 75%);color:var(--amber);font:400 14px/1.45 "PT Mono",ui-monospace,Menlo,Consolas,monospace;text-shadow:0 0 6px rgba(255,182,66,.45);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.35) 100%)}
#app{position:relative;z-index:1;height:100%;max-width:none;margin:0 auto;display:flex;flex-direction:column}
#gl{position:fixed;left:0;top:0;z-index:0;display:none}
.table.t3d{background:none!important}
.table.t3d~.hand{background:none;overflow:visible}
.table.t3d~.hand .hc{box-shadow:inset 0 0 0 1px rgba(90,60,20,.35),0 14px 18px rgba(0,0,0,.7),0 3px 4px rgba(0,0,0,.6)}
#glfx{position:fixed;left:0;top:0;z-index:0;pointer-events:none;display:none;overflow:hidden}
#glfx .lightcap{position:absolute;inset:0;transform:none;background:radial-gradient(ellipse 66% 60% at 50% 32%,rgba(255,178,98,.1) 0,rgba(255,160,72,.04) 22%,rgba(30,16,6,.16) 46%,rgba(10,6,3,.48) 70%,rgba(3,2,1,.8) 90%,rgba(1,1,0,.92) 100%)}
#glfx .flick{transform:none}
h1,h2,.btn,summary,.status b{font-family:Oswald,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.07em}
h1{font-weight:600;font-size:clamp(36px,13vw,52px);line-height:1;margin:0 0 14px;padding-bottom:10px;border-bottom:3px solid var(--amber);box-shadow:0 6px 0 -4px var(--amber)}
h2{font-weight:600;font-size:19px;line-height:1.2;margin:0 0 8px}
h2::before{content:"> "}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;text-shadow:inherit;padding:0}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn{background:var(--amber);color:var(--bg);font-weight:600;font-size:16px;line-height:1.25;padding:12px 16px;width:100%;text-align:center;overflow-wrap:anywhere;text-shadow:none;box-shadow:0 0 12px rgba(255,182,66,.35)}
.btn.ghost{background:rgba(255,182,66,.06);color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber);text-shadow:inherit}
.btn:disabled{opacity:.35}
.btn.sm{width:auto;padding:7px 10px;font-size:13px}
.btn.ic{width:36px;height:36px;padding:0;font-size:16px;flex:none;display:grid;place-items:center;line-height:1}
.page{padding:22px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px;width:100%;max-width:560px;margin:0 auto}
.sec{display:grid;gap:10px}
.sub{color:var(--dim);margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.code{font:600 46px/1 Oswald,sans-serif;letter-spacing:.16em}
.link{margin:0;padding:10px;border:1px dashed var(--line);word-break:break-all;-webkit-user-select:text;user-select:text}
details{border-top:1px solid var(--line);padding-top:10px}
summary{font-weight:600;cursor:pointer}
details ul,.rules ul{padding-left:18px;margin:8px 0;color:var(--dim);font-size:13px}
li{margin:5px 0}
li::marker{content:"- "}

.game{flex:1;min-height:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel);border-bottom:2px solid var(--amber);font-size:12px}
.top .who{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top b{font:600 16px/1.2 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.06em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{box-shadow:inset 0 0 0 2px var(--paper),0 1px 0 rgba(0,0,0,.7);border-radius:3px;background:#7c2318}
.bk0{background:repeating-linear-gradient(45deg,transparent 0 4px,rgba(0,0,0,.28) 4px 5px),repeating-linear-gradient(-45deg,transparent 0 4px,rgba(0,0,0,.28) 4px 5px),#7c2318}
.bk1{background:repeating-linear-gradient(0deg,transparent 0 4px,rgba(255,255,255,.16) 4px 5px),repeating-linear-gradient(90deg,transparent 0 4px,rgba(255,255,255,.16) 4px 5px),#1f3f66}
.bk2{background:repeating-linear-gradient(60deg,transparent 0 5px,rgba(0,0,0,.3) 5px 6px),repeating-linear-gradient(-60deg,transparent 0 5px,rgba(0,0,0,.3) 5px 6px),#24553d}
.bk3{background:radial-gradient(circle at 50% 50%,#c9a24b 0 14%,transparent 15%),repeating-radial-gradient(circle at 50% 50%,transparent 0 4px,rgba(201,162,75,.4) 4px 5px),#17130c}
.bk4{background:radial-gradient(circle at 50% 50%,#3a2410 0 16%,transparent 17%),repeating-conic-gradient(from 0deg at 50% 50%,#c08a3c 0 12deg,#8a5a24 12deg 24deg)}
.bk5{background:radial-gradient(circle at 50% 50%,#e4d6ae 0 9%,transparent 10%),repeating-radial-gradient(ellipse 60% 30% at 50% 50%,transparent 0 5px,rgba(255,255,255,.22) 5px 6px),#1d5a5c}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:46px;height:64px;flex:none;border-radius:4px}
.swatch.on{outline:3px solid var(--amber);outline-offset:3px;box-shadow:inset 0 0 0 2px var(--paper),0 0 14px var(--amber)}
input[type=text]{background:rgba(255,182,66,.06);border:0;border-radius:0;box-shadow:inset 0 0 0 2px var(--line);color:var(--amber);font:inherit;font-size:16px;padding:11px 12px;width:100%;-webkit-user-select:text;user-select:text;text-shadow:inherit}
input[type=text]::placeholder{color:var(--dim)}
input[type=text]:focus{outline:0;box-shadow:inset 0 0 0 2px var(--amber)}
input[type=range]{width:100%;accent-color:var(--amber);margin:6px 0 0}
.rng{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rng b{font:600 22px Oswald,sans-serif}
.box{border:1px solid var(--line);padding:12px;display:grid;gap:10px}
table{width:100%;border-collapse:collapse;font-size:13px;text-align:right}
th,td{padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:400}
th:first-child,td:first-child{text-align:left;overflow-wrap:anywhere}
.btn.mute{text-decoration:line-through;opacity:.6}
.ohand{display:flex;flex:0 1 auto;min-width:0;overflow:hidden;padding:2px 0 2px 9px}
.ohand .back{flex:none;width:18px;height:26px;margin-left:-9px}
.pile{position:relative;width:32px;height:44px;flex:none;box-shadow:inset 0 0 0 2px var(--paper),2px 2px 0 rgba(0,0,0,.75),4px 4px 0 rgba(0,0,0,.5)}
.pile span{position:absolute;inset:0;display:grid;place-items:center;color:var(--paper);font:600 15px Oswald,sans-serif;text-shadow:0 1px 2px #000}

.table{flex:1;min-height:0;position:relative;overflow:hidden;perspective:780px;perspective-origin:50% -4%;background:radial-gradient(ellipse at 50% 0,#3a2612 0,#0b0704 62%)}
@keyframes sway{from{perspective-origin:44% -4%}to{perspective-origin:56% -4%}}
.plane{position:absolute;left:-9%;right:-9%;bottom:20px;height:124%;display:grid;grid-template-columns:repeat(3,1fr);padding:9% 11.5% 8px;transform:rotateX(31deg);transform-origin:50% 100%;transform-style:preserve-3d;
  background:repeating-linear-gradient(91deg,rgba(0,0,0,.16) 0 2px,transparent 2px 9px,rgba(255,200,120,.035) 9px 11px,transparent 11px 23px),repeating-linear-gradient(88deg,transparent 0 37px,rgba(0,0,0,.12) 37px 39px),radial-gradient(ellipse at 50% 66%,#6e4a2c 0,#3c2614 55%,#170d06 100%);
  box-shadow:inset 0 0 80px rgba(0,0,0,.75),inset 0 0 0 6px #24160b,inset 0 0 0 8px rgba(255,182,66,.22)}
.plane::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 46% 40% at 50% 70%,rgba(255,220,160,.2) 0,transparent 100%)}
.plane::after{content:"";position:absolute;left:0;right:0;top:100%;height:30px;transform-origin:50% 0;transform:rotateX(-90deg);background:linear-gradient(#4a2f17,#1a0f06 70%);box-shadow:inset 0 3px 0 rgba(255,190,110,.22)}
.col{display:flex;flex-direction:column;min-height:0;gap:6px;padding:0 4px;transform-style:preserve-3d}
.col+.col{border-left:1px dashed rgba(255,182,66,.16)}
.car{flex:1;min-height:0;display:flex;flex-direction:column;padding:3px;border:1.5px dashed transparent;border-radius:8px;transform-style:preserve-3d;transform:translateZ(.6px)}
.car.opp{justify-content:flex-end}
.car.empty{border-color:rgba(255,182,66,.22);background:rgba(0,0,0,.18)}
.car.tgt{border-color:var(--amber);background:rgba(255,182,66,.13);box-shadow:inset 0 0 18px rgba(255,182,66,.28)}
.car.hov{background:rgba(255,182,66,.3)}
.slot{flex:0 1 var(--strip);min-height:calc(var(--strip)*.55);display:flex;justify-content:center;align-items:flex-start;transform-style:preserve-3d}
.slot:last-child{flex:0 0 var(--ch)}
.card{--c1:#a8281c;--c2:#1f3f7a;--gd:#d6a32c;--sk:#efd3ac;--ln:#1a1712;--pp:#f4eedd;
  position:relative;flex:none;display:block;width:var(--cw);aspect-ratio:5/7;max-width:100%;container-type:inline-size;overflow:hidden;
  background:var(--stain,none) 0 0/100% 100% no-repeat,var(--grain,none),linear-gradient(140deg,#f3ead0 0,#e9dcb6 50%,#d6c492 100%);
  color:var(--ink);text-shadow:none;border-radius:7cqw;border-radius:5px;font-family:"Libre Baskerville",Georgia,"Times New Roman",serif;font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(90,60,20,.45),inset 0 0 10px rgba(120,80,30,.28),0 1px 0 #b9a777,0 2px 0 #8f7c4e,var(--drop)}
.card:not(.red){--c1:#1f3f7a;--c2:#a8281c}
.slot .card{transform:translateZ(calc(var(--z,0)*3.5px + 1px));transition:transform .15s}
.slot .card.tgt{transform:translateZ(calc(var(--z,0)*3.5px + 12px))}
.card.red,.red{color:var(--blood)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.card svg{display:block;fill:currentColor}
.card .ix{position:absolute;top:3.5%;left:5%;display:flex;flex-direction:column;align-items:center;line-height:.95;font-size:14px;font-size:23cqw;letter-spacing:-.04em}
.card .ix svg{width:9px;height:9px;width:15cqw;height:15cqw;margin-top:3%}
.card .ix2{top:auto;left:auto;bottom:3.5%;right:5%;transform:rotate(180deg)}
.card .pips{position:absolute;top:11%;bottom:11%;left:21%;right:21%}
.card .pips svg{position:absolute;width:12px;height:12px;width:20cqw;height:20cqw;transform:translate(-50%,-50%)}
.card .pips svg.fl{transform:translate(-50%,-50%) rotate(180deg)}
.card .pips.ace svg{width:30px;height:30px;width:50cqw;height:50cqw}
.card .court{position:absolute;top:8%;bottom:8%;left:21%;right:8%}
.card .court svg{width:100%;height:100%;fill:none}
.card .court b{display:none}
.card .court.jkr{left:21%;right:21%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5%;border:1.5px solid currentColor}
.card .court.jkr b{display:block;font-size:26px;font-size:44cqw;line-height:1;font-weight:400}
.card .court.jkr em{font-style:normal;font-size:8px;font-size:13cqw;letter-spacing:.08em}
.card .fx{position:absolute;top:3px;right:4px;display:flex;gap:2px;z-index:2}
.card .fx b{background:#fbf3d6;color:#1a1712;box-shadow:0 0 0 1px rgba(0,0,0,.5);border-radius:2px;padding:1px 2px;font:600 10px/1 Oswald,sans-serif;font-size:16cqw}
.card .fx b.red{color:#9a2a1c}
/* deck skins: 0 worn, 1 gloss, 2 scratched, 3 black and gold, 4 burnt, 5 hand-drawn */
.card.sk1{--ink:#10151f;--blood:#c5161f;--c1:#c5161f;--c2:#14397d;--pp:#fff;font-family:Oswald,"Arial Narrow",sans-serif;font-weight:600;background:linear-gradient(160deg,#fbfcfd 0,#eef1f4 55%,#d9dfe6 100%);box-shadow:inset 0 0 0 1px rgba(20,30,50,.3),0 1px 0 #cfd4da,0 2px 0 #9aa1aa,var(--drop)}
.card.sk1:not(.red){--c1:#14397d;--c2:#c5161f}
.card.sk1::after{background:linear-gradient(118deg,transparent 0 36%,rgba(255,255,255,.75) 37% 49%,transparent 50% 74%,rgba(255,255,255,.5) 75% 80%,transparent 81%)}
.card.sk2{--ink:#27302a;--blood:#8f3024;background:var(--grain,none),linear-gradient(150deg,#e4e6d6 0,#cfd4be 60%,#b5bca2 100%)}
.card.sk2::after{background:var(--scratch,none) 0 0/100% 100% no-repeat}
.card.sk2 .ix,.card.sk2 .pips,.card.sk2 .court{opacity:.8}
.card.sk3{--ink:#e2bd6a;--blood:#ec7a5e;--c1:#3a2e18;--c2:#1b150b;--gd:#e2bd6a;--sk:#2c2415;--ln:#e2bd6a;--pp:#15110b;font-family:Cinzel,Georgia,serif;background:linear-gradient(145deg,#2c2519 0,#15110b 55%,#0a0805 100%);box-shadow:inset 0 0 0 1px #e2bd6a,inset 0 0 0 3px #15110b,inset 0 0 0 4px rgba(226,189,106,.6),0 1px 0 #5a4a25,0 2px 0 #2a2212,var(--drop)}
.card.sk3.red{--c1:#5a1f14}
.card.sk3::after{background:linear-gradient(125deg,rgba(255,235,180,.2) 0 24%,transparent 25%)}
.card.sk4{--ink:#2a1a0e;--blood:#8c2a12;background:var(--grain,none),linear-gradient(150deg,#e6d29c 0,#d2b77e 55%,#aa8a50 100%);border-radius:6px 4px 8px 3px}
.card.sk4::after{background:var(--burn,none) 0 0/100% 100% no-repeat}
.card.sk6{--ink:#1c2f6b;--blood:#c22f25;font-family:"Permanent Marker","Comic Sans MS",cursive;font-weight:400;border:2px solid #1c2f6b;border-radius:13px 5px 15px 6px/6px 14px 5px 13px;
  background:linear-gradient(90deg,transparent 0 11%,rgba(200,60,50,.45) 11% 12.5%,transparent 12.5%),repeating-linear-gradient(transparent 0 8px,rgba(60,110,170,.3) 8px 9px),#f6f3e6;box-shadow:var(--drop)}
.card.sk6 .ix{rotate:-4deg}
.card.sk6 .pips svg,.card.sk6 .ix svg{fill:none;stroke:currentColor;stroke-width:7;stroke-linejoin:round}
.card.sk6 .pips svg:nth-child(odd){rotate:-11deg}
.card.sk6 .pips svg:nth-child(even){rotate:8deg}
.card.sk6 .court{left:21%;right:21%;border:2px solid currentColor;border-radius:9px 4px 11px 5px/5px 10px 4px 9px;rotate:1.5deg;display:grid;place-items:center}
.card.sk6 .court svg{display:none}
.card.sk6 .court b{display:block;font-size:32px;font-size:56cqw;line-height:1}
.preview{display:flex;gap:10px;align-items:center}
.preview .card{--cw:64px;width:64px}
.card.tgt{outline:2.5px solid var(--amber);outline-offset:0}
.card.hov{outline:4px solid #fff}
.slot.new .card{animation:drop .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes drop{from{transform:translateZ(190px) translateY(40px) rotateX(-55deg) rotateZ(-14deg);opacity:.2}}
.score{transform:rotateX(-31deg);transform-origin:50% 100%;box-shadow:0 14px 16px rgba(0,0,0,.6);background:rgba(18,14,8,.94);border:1px solid var(--line);padding:3px;font:600 var(--sc)/1.15 Oswald,sans-serif;display:grid;gap:2px}
.score div{display:flex;justify-content:space-between;align-items:baseline;color:var(--dim);padding:1px 5px}
.score small{font-size:.62em;font-weight:500}
.score .sold{background:var(--amber);color:var(--bg);text-shadow:none;animation:pulse 1.4s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 14px var(--amber)}}
.score .bust{color:var(--warn);text-decoration:line-through}
.score .lead::before{content:"●";font-size:.45em;margin-right:3px;align-self:center}
.score .me{border-top:1px solid var(--line);padding-top:2px}
.status{padding:6px 10px;background:var(--panel);border-top:2px solid var(--amber);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.status b{font-size:14px;flex:1 1 auto;min-width:0}
.status span{color:var(--dim);text-align:right;flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
.hand{display:flex;padding:22px 14px 18px;justify-content:center;align-items:flex-start;overflow:visible;position:relative;z-index:2;perspective:520px;perspective-origin:50% 120%;background:linear-gradient(#0b0704,#1a1109)}
.hc{overflow:hidden;flex:0 1 var(--hw);width:auto;height:auto;min-width:0;aspect-ratio:5/7;margin:0 1px;padding:0;touch-action:none;cursor:grab;transform:translateY(calc(var(--y)*1px)) rotate(calc(var(--r)*1deg)) rotateY(calc(var(--r)*-2.2deg)) rotateX(10deg);transition:transform .14s}
.hc.sel{transform:translateY(-16px) translateZ(46px) rotate(calc(var(--r)*1deg)) rotateX(0deg);outline:3px solid var(--amber);box-shadow:0 0 18px var(--amber),0 16px 18px rgba(0,0,0,.7)}
.hc.lifted{opacity:.22}
.dragghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;margin:0;flex:none;transition:none;box-shadow:0 0 0 2px var(--amber),0 18px 26px rgba(0,0,0,.7)}
.acts{display:flex;gap:8px;padding:4px 10px 10px;align-items:stretch}
.acts .btn{flex:1 1 0;min-width:0;padding:9px 4px;font-size:13px;line-height:1.2}
.acts .pile{align-self:center}
.acts .on,.acts .btn.hov{background:var(--amber);color:var(--bg);text-shadow:none}
.over{position:fixed;inset:0;background:rgba(8,6,3,.9);display:flex;align-items:center;justify-content:center;padding:24px;z-index:45}
.over>div{background:var(--panel);border:2px solid var(--amber);box-shadow:0 0 24px rgba(255,182,66,.3);padding:22px;width:100%;max-width:380px;display:grid;gap:14px;text-align:center;max-height:90%;overflow:auto}
.over h1{font-size:40px}
.over .rules{text-align:left}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.chip{position:relative;padding:8px 0;font:600 15px/1 Oswald,sans-serif;text-align:center;opacity:.3;background:var(--paper);color:var(--ink);text-shadow:none;border-radius:4px}
.chip.red{color:var(--blood)}
.chip.n1,.chip.n2{opacity:1}
.chip.n2::after{content:"×2";position:absolute;top:-5px;right:-3px;background:var(--amber);color:var(--bg);font-size:10px;padding:1px 3px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--amber);color:var(--bg);text-shadow:none;padding:10px 14px;font-size:13px;max-width:90%;width:max-content;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#toast.show{opacity:1}

@media (min-width:640px) and (orientation:landscape){
  .game{display:grid;grid-template-columns:minmax(0,1fr) var(--side);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"table top" "table status" "table fill" "hand acts"}
  .table{grid-area:table}
  .top{grid-area:top;flex-wrap:wrap;border-bottom:0;border-left:2px solid var(--amber);padding:10px}
  .top .who{flex:1 0 100%}
  .ohand{flex:1 1 0}
  .status{grid-area:status;flex-direction:column;align-items:flex-start;border-top:1px solid var(--line);border-left:2px solid var(--amber);padding:10px;gap:6px}
  .status span{text-align:left}
  .game::after{content:"";grid-area:fill;background:var(--panel);border-left:2px solid var(--amber)}
  .hand{grid-area:hand;background:rgba(0,0,0,.25)}
  .acts{grid-area:acts;flex-wrap:wrap;background:var(--panel);border-left:2px solid var(--amber);padding:10px;align-content:flex-end}
  .acts .btn{flex:1 0 100%}
}

  else{deck=[];for(const c in builder)for(let i=0;i<builder[c];i++)deck.push(c)}

async function commit(cars,hand,deck,text,o={}){
  busy=true;
  const me=meIdx(),pk='p'+me,ok='p'+(1-me),wasOpening=game.op[pk]<3,old=priv;
  if(deck.length&&(o.forceDraw||(!wasOpening&&hand.length<5)))hand.push(deck.shift());
  const op={...game.op};if(o.opening)op[pk]++;
  let winner=winnerOf(cars,op);
  if(winner<0&&op[ok]>=3&&game.hc[ok]===0&&game.dc[ok]===0)winner=me;
  if(local){
    privs[me]={round:game.round,deck,hand};
    Object.assign(game,{cars,turn:1-me,op,last:{by:me,t:text},winner,mv:(game.mv||0)+1});game.dc[pk]=deck.length;game.hc[pk]=hand.length;
    if(winner<0){viewer=1-me;handoff=true}
    priv=privs[viewer];saveLocal();busy=false;sel=null;mode=null;return render();
  }
  if(p2p){
    priv={round:game.round,deck,hand};
    Object.assign(game,{cars,turn:1-me,op,last:{by:me,t:text},winner,seq:game.seq+1,mv:(game.mv||0)+1});game.dc[pk]=deck.length;game.hc[pk]=hand.length;
    pubGame();saveP2P();busy=false;sel=null;mode=null;return render();
  }
  try{
    priv={round:game.round,deck,hand};
    await privRef().set(priv);
    try{await gameRef().update({cars,turn:1-me,dc:{[pk]:deck.length},hc:{[pk]:hand.length},op:{[pk]:op[pk]},last:{by:me,t:text},winner,mv:(game.mv||0)+1})}
    catch(e){priv=old;await privRef().set(old).catch(()=>{});throw e}
  }catch(e){fail(e)}
  busy=false;sel=null;mode=null;render();
}
const cloneCars=()=>JSON.parse(JSON.stringify(game.cars));
const mine=k=>(k/3|0)===meIdx();
const opening=()=>game.op['p'+meIdx()]<3;
const myTurn=()=>game.turn===meIdx()&&game.winner<0&&!busy&&(!p2p||netUp());
const legalNum=(c,k)=>mine(k)&&(opening()?!game.cars[k].cards.length:canPlayNum(c,game.cars[k]));
const legalFace=(c,k,ci)=>!opening();

function tapTable(k,ci){
  if(!myTurn())return;
  if(mode==='disband'){
    if(mine(k)&&game.cars[k].cards.length){const cars=cloneCars();cars[k].cards=[];commit(cars,[...priv.hand],[...priv.deck],'распущен караван '+(k%3+1))}
    return;
  }
  if(sel==null)return;
  const c=priv.hand[sel],hand=[...priv.hand],deck=[...priv.deck],cars=cloneCars();
  if(isNum(c)){
    if(!legalNum(c,k))return SFX.miss(),toast(opening()?'Сначала положите по карте на каждый свой пустой караван':'Эту карту сюда нельзя');
    hand.splice(sel,1);cars[k].cards.push({c,f:[]});
    return commit(cars,hand,deck,lab(c)+' → караван '+(k%3+1),{opening:opening()});
  }
  if(ci==null)return;
  if(!legalFace(c,k,ci))return SFX.miss(),toast('Картинки — после начальной раскладки');
  hand.splice(sel,1);
  const t=cars[k].cards[ci];let text=lab(c)+' на '+lab(t.c);
  if(rk(c)==='J')cars[k].cards.splice(ci,1);
  else{
    t.f.push(c);
    if(c==='JK'){
      let n=0;const ace=rk(t.c)==='A';
      for(const car of cars)car.cards=car.cards.filter(x=>{const hit=x!==t&&(ace?st(x.c)===st(t.c):rk(x.c)!=='A'&&nv(x.c)===nv(t.c));n+=hit;return !hit});
      text+=', убрано карт: '+n;
    }
  }
  commit(cars,hand,deck,text);
}
function discard(){
  if(!myTurn()||sel==null||(opening()&&priv.hand.some(isNum)))return;
  const hand=[...priv.hand];hand.splice(sel,1);
  commit(cloneCars(),hand,[...priv.deck],'сброс карты',{forceDraw:true});
}
async function rematch(){
  if(busy)return;
  if(local){
    Object.assign(game,{ready:{p0:false,p1:false},dc:{p0:0,p1:0},hc:{p0:0,p1:0},op:{p0:0,p1:0},cars:emptyCars(),winner:-1,last:null,mv:0,turn:1-game.winner,round:game.round+1});
    privs=[null,null];viewer=0;priv=null;saveLocal();return render();
  }
  if(p2p){
    if(!netUp())return toast('Нет связи с сервером');
    Object.assign(game,{ready:{p0:false,p1:false},dc:{p0:0,p1:0},hc:{p0:0,p1:0},op:{p0:0,p1:0},cars:emptyCars(),winner:-1,last:null,mv:0,turn:1-game.winner,round:game.round+1,seq:0});
    priv=null;pubGame();saveP2P();return render();
  }
  busy=true;
  try{await gameRef().update({ready:{p0:false,p1:false},dc:{p0:0,p1:0},hc:{p0:0,p1:0},op:{p0:0,p1:0},cars:emptyCars(),winner:-1,last:null,mv:0,turn:1-game.winner,round:game.round+1})}catch(e){fail(e)}
  busy=false;
}

const RULES=`<ul>
<li>У каждого три каравана. Караван продан, когда его сумма от 21 до 26.</li>
<li>Игра кончается, когда в каждой из трёх пар караванов есть проданный (при равенстве пара не считается). Побеждает тот, у кого больше стоимость в двух парах из трёх.</li>
<li>Начало: по очереди кладёте по одной числовой карте на каждый свой караван. Дальше в руке 5 карт.</li>
<li>Ход: сыграть карту, либо сбросить карту, либо распустить свой караван.</li>
<li>Туз = 1, 2–10 по номиналу. Вторая карта задаёт направление (вверх или вниз). Дальше карта должна идти по направлению или совпадать по масти с последней. Одинаковое значение подряд нельзя.</li>
<li>Король — удваивает карту, на которую положен (свою или чужую).</li>
<li>Валет — убирает карту вместе с её картинками.</li>
<li>Дама — кладётся на любую числовую карту. Если это последняя карта каравана, меняет его направление и текущую масть.</li>
<li>Джокер на туза — убирает со стола все остальные числовые карты этой масти. Джокер на 2–10 — убирает все остальные карты этого значения.</li>
<li>Если на вашем ходу нет ни карт в руке, ни колоды — вы проиграли.</li></ul>`;

    [[op,game.dc['p'+op]],[me,priv.deck.length]].forEach(([pl,cnt],i)=>{const m=piles[i],h=Math.max(.02,cnt*.007);m.visible=cnt>0;m.scale.y=h;m.position.y=h/2;m.material[2]=mat('b'+skOf(pl),backSVG(skOf(pl)))});
    draw();
  }
  function pick(x,y){
    if(!ok)return null;const r=cv.getBoundingClientRect();ray.setFromCamera({x:(x-r.left)/r.width*2-1,y:-((y-r.top)/r.height)*2+1},cam);
    const hit=ray.intersectObjects(root.children,true).find(h=>h.object.userData&&h.object.userData.k!==undefined);
    if(hit)return{k:hit.object.userData.k,ci:hit.object.userData.i};
    const ph=ray.intersectObjects(piles,false)[0];if(ph)return{pile:piles.indexOf(ph.object)};
    const p=new T.Vector3();if(!ray.ray.intersectPlane(new T.Plane(new T.Vector3(0,1,0),0),p))return null;
    const lane=LX.findIndex(v=>Math.abs(p.x-v)<1.55);if(lane<0||Math.abs(p.z)<.55||Math.abs(p.z)>5.6)return null;
    const me=meIdx();return{k:(p.z>0?me:1-me)*3+lane,ci:null};
  }
  let hov=null,hovRun=0,fxs=[];
  function hovStep(){
    hovRun=0;if(cv.style.display==='none')return;let active=false;
    for(const g of cards){const u=g.userData;if(u.ty===undefined)continue;
      const dy=u.ty-g.position.y,dz=u.tz-g.rotation.z,dx=u.tx-g.rotation.x;
      if(Math.abs(dy)+Math.abs(dz)+Math.abs(dx)<.0012){g.position.y=u.ty;g.rotation.z=u.tz;g.rotation.x=u.tx;if(g!==hov)u.ty=undefined;continue}
      g.position.y+=dy*.2;g.rotation.z+=dz*.2;g.rotation.x+=dx*.2;active=true}
    ren.render(scene,cam);if(active)hovRun=requestAnimationFrame(hovStep);
  }
  function hover(x,y){
    if(!ok||cv.style.display==='none')return;let g=null,hit=null;
    if(x>=0){const r=cv.getBoundingClientRect();ray.setFromCamera({x:(x-r.left)/r.width*2-1,y:-((y-r.top)/r.height)*2+1},cam);hit=ray.intersectObjects(root.children,true).find(h=>h.object.userData&&h.object.userData.k!==undefined);g=hit?hit.object.parent:null}
    if(hov&&hov!==g&&hov.userData.base!==undefined){const u=hov.userData;u.ty=u.base;u.tz=0;u.tx=0}
    if(g&&!anims.some(a=>a.g===g)){const u=g.userData;if(u.base===undefined)u.base=g.position.y;const dx=Math.max(-.5,Math.min(.5,hit.point.x-g.position.x)),dz=Math.max(-.7,Math.min(.7,hit.point.z-g.position.z));u.ty=u.base+.1;u.tz=-dx*.15;u.tx=dz*.09}
    if((g||hov)&&!hovRun)hovRun=requestAnimationFrame(hovStep);hov=g;
  }
  /* clicking a deck: the top cards spring up into a fan and drop back */
  function deckFx(i){
    const p=piles[i];if(!ok||!p||!p.visible||fxs.some(f=>f.i===i))return;
    const top=p.scale.y,n=7,gs=[],toward=p.position.z>0?-1:1;
    for(let k=0;k<n;k++){const m=new T.Mesh(geo,p.material[2]);m.castShadow=true;scene.add(m);gs.push(m)}
    const fx={i,t0:performance.now(),d:1150,step(q){
      const up=Math.sin(Math.min(1,q*1.7)*Math.PI/2),back=q>.6?(q-.6)/.4:0,e=up*(1-back*back);
      gs.forEach((m,k)=>{const f=(k-(n-1)/2)/((n-1)/2);m.position.set(p.position.x-e*1+f*e*1.25,top+.012+k*.005+e*(1-Math.abs(f)*.3),p.position.z+toward*e*.5+Math.abs(f)*e*.25);m.rotation.set(e*-.35*toward,p.rotation.y-f*e*.6,-f*e*.22)})},
      end(){gs.forEach(m=>scene.remove(m))}};
    fxs.push(fx);draw();
    /* safety net: tidy up even if the browser stops delivering frames */
    setTimeout(()=>{if(fxs.includes(fx)){fx.end();fxs=fxs.filter(f=>f!==fx);try{cancelAnimationFrame(raf)}catch(e){}raf=0;draw()}},fx.d+120);
  }
  function screenOf(k,i){const me=meIdx(),mine=(k/3|0)===me,n=game.cars[k].cards.length,L=i==null?{x:LX[k%3],y:0,z:zc(mine)}:layout(k,i,n,mine),v=new T.Vector3(L.x,L.y,L.z-(i==null?0:.55)).project(cam),r=cv.getBoundingClientRect();return[r.left+(v.x+1)/2*r.width,r.top+(1-v.y)/2*r.height]}
  return{init,sync,pick,hover,deckFx,screenOf,get ready(){return ok}};
})();
async function load3d(){
  if(!want3d())return;
  for(const src of ['three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js']){
    if(window.THREE)break;
    await new Promise(r=>{const x=document.createElement('script');x.src=src;x.onload=x.onerror=r;document.head.appendChild(x);setTimeout(r,9000)});
  }
  if(window.THREE&&GL.init()){use3d=want3d();lastHtml=null;render()}
}
addEventListener('resize',()=>{const w=GL.ready&&want3d();if(w!==use3d){use3d=w;lastHtml=null}render()});
function fitCars(){
  if(use3d)return;
  const tb=app.querySelector('.table');if(!tb)return;const tr=tb.getBoundingClientRect();
  for(const car of app.querySelectorAll('.car')){
    car.style.removeProperty('--fit');car.style.removeProperty('--cs');car.style.removeProperty('padding-top');
    const n=car.children.length;if(!n)continue;
    /* the far end of the opponent's lane runs past the top of the screen: keep cards out of that part */
    const cr=car.getBoundingClientRect(),hid=cr.height>0?Math.max(0,tr.top+5-cr.top)/cr.height*car.clientHeight*1.5:0;
    if(hid>1)car.style.paddingTop=(3+hid).toFixed(0)+'px';
    if(n<2)continue;
    const h=car.lastElementChild.firstElementChild.offsetHeight,H=car.clientHeight-6-hid,s0=car.firstElementChild.offsetHeight;
    if(!h||h+(n-1)*s0<=H+1)continue;
    const fit=(H-h)/(n-1);
    if(fit>=12){car.style.setProperty('--fit',fit.toFixed(1)+'px');continue}
    let cs=Math.min(1,(H-(n-1)*11)/h),f=11;
    if(cs<.6){cs=.6;f=Math.max(3,(H-h*.6)/(n-1))}
    car.style.setProperty('--cs',cs.toFixed(3));car.style.setProperty('--fit',f.toFixed(1)+'px');
  }
}
let drag=null,swallow=false;
function clearMarks(){app.querySelectorAll('.tgt,.hov').forEach(x=>x.classList.remove('tgt','hov'))}
function dropTarget(x,y){
  const t=document.elementFromPoint(x,y);if(!t)return null;
  const d=t.closest('[data-act="discard"]');if(d)return{el:d,discard:true};
  if(use3d&&t.closest('.t3d')){const r=GL.pick(x,y);return r&&r.k!==undefined?{el:null,k:r.k,ci:r.ci}:null}
  const z=t.closest('[data-car]');if(!z)return null;
  const c=t.closest('[data-ci]'),num=isNum(priv.hand[drag.i]);
  return{el:num?z:c,k:+z.dataset.car,ci:c?+c.dataset.ci:null};
}
app.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-h]');
  if(!h||drag||!game||!priv||!myTurn()||e.button>0)return;
  drag={el:h,i:+h.dataset.h,x:e.clientX,y:e.clientY,id:e.pointerId,on:false};
  try{h.setPointerCapture(e.pointerId)}catch(_){}
});
app.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
    drag.on=true;sel=drag.i;mode=null;
    const r=drag.el.getBoundingClientRect(),g=drag.el.cloneNode(true);
    g.className='card hc dragghost sk'+skOf(meIdx())+' '+wearCls(priv.hand[sel],skOf(meIdx()))+' '+(red(priv.hand[sel])?'red ':'')+(priv.hand[sel]==='JK'?'jk':'');
    g.removeAttribute('data-h');g.style.width=r.width+'px';g.style.height=r.height+'px';
    drag.g=g;drag.w=r.width;drag.h=r.height;document.body.appendChild(g);
    clearMarks();app.querySelectorAll('.hc.sel').forEach(x=>x.classList.remove('sel'));drag.el.classList.add('lifted');
    const c=priv.hand[sel];
    app.querySelectorAll('[data-car]').forEach(z=>{
      const k=+z.dataset.car;
      if(isNum(c))z.classList.toggle('tgt',legalNum(c,k));
      else z.querySelectorAll('[data-ci]').forEach(t=>t.classList.toggle('tgt',legalFace(c,k,+t.dataset.ci)));
    });
    const d=app.querySelector('[data-act="discard"]');if(d)d.disabled=opening()&&priv.hand.some(isNum);
    GL.sync();
  }
  drag.g.style.transform=`translate(${e.clientX-drag.w/2}px,${e.clientY-drag.h*.75}px) rotate(4deg) scale(1.08)`;
  app.querySelectorAll('.hov').forEach(x=>x.classList.remove('hov'));
  const t=dropTarget(e.clientX,e.clientY);
  if(t&&t.el&&(t.discard?!t.el.disabled:t.el.classList.contains('tgt')))t.el.classList.add('hov');
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;
  if(!d.on){drag=null;return}
  const t=cancel?null:dropTarget(e.clientX,e.clientY);
  d.g.remove();drag=null;lastHtml=null;swallow=true;setTimeout(()=>swallow=false,80);
  if(t&&t.discard){if(t.el.disabled)toast('Сначала разложите начальные карты');else discard()}
  else if(t)tapTable(t.k,t.ci);
  if(!busy)sel=null;
  render();
}
app.addEventListener('pointerup',e=>endDrag(e,false));
app.addEventListener('pointercancel',e=>endDrag(e,true));

app.addEventListener('click',e=>{
  const pl=e.target.closest('.pile');
  if(pl&&!pl.classList.contains('riff')){pl.classList.add('riff');SFX.shuffle();setTimeout(()=>pl.classList.remove('riff'),760);return}
  const a=e.target.closest('[data-act]');
  if(a){
    const d=a.dataset;if(d.act!=='mute')SFX.blip();
    switch(d.act){
      case 'create':return createTable();
      case 'local':return startLocal(false);
      case 'localResume':return startLocal(true);
      case 'show':handoff=false;return render();
      case 'p2pNew':return startP2P(0);
      case 'p2pResume':{const sv=LS.get('caravan_p2p');return sv?startP2P(sv.role,sv.code,sv):render()}
      case 'share':if(navigator.share)return navigator.share({title:'Караван',text:'Сыграем в Караван?',url:roomUrl()}).catch(()=>{});
      case 'copy':return navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(roomUrl()).then(()=>toast('Ссылка скопирована'),()=>toast('Выделите и скопируйте ссылку вручную')):toast('Выделите и скопируйте ссылку вручную');
      case 'join':return joinTable(d.code);
      case 'resume':return enter(d.code);
      case 'leave':return leave();
      case 'close':return closeTable();
      case 'deck':return chooseDeck(d.kind);
      case 'builder':return openBuilder();
      case 'builderBack':builder=null;return render();
      case 'chip':builder[d.c]=((builder[d.c]||0)+1)%3;return render();
      case 'rules':overlay='rules';return render();
      case 'closeOverlay':overlay=null;return render();
      case 'discard':return discard();
      case 'disband':mode=mode==='disband'?null:'disband';sel=null;return render();
      case 'rematch':return rematch();
      case 'records':overlay='records';return render();
      case 'volSet':vol=+d.v/100;LS.set('caravan_vol',vol);if(vol>0&&muted){muted=false;LS.set('caravan_mute',false)}applyVol();unlock();SFX.place();return render();
      case 'tbl':tblSel=(tblSel+1)%TABLES.length;LS.set('caravan_table',tblSel);paintTable(tblSel);return toast(`Стол ${tblSel+1}/${TABLES.length}: ${TABLES[tblSel]}`);
      case 'clearStats':LS.set('caravan_stats',{p:{},seen:(LS.get('caravan_stats')||{seen:[]}).seen});return render();
      case 'mute':overlay='sound';return render();
      case 'muteT':muted=!muted;LS.set('caravan_mute',muted);unlock();if(!muted)SFX.place();return render();
      case 'back':backSel=+d.b;return render();
    }
    return;
  }
  const h=e.target.closest('[data-h]');
  if(h){if(swallow)return;SFX.select();sel=sel===+h.dataset.h?null:+h.dataset.h;mode=null;return render()}
  if(use3d&&e.target.closest('.t3d')){const r=GL.pick(e.clientX,e.clientY);if(r&&r.pile!==undefined){GL.deckFx(r.pile);SFX.shuffle()}else if(r)tapTable(r.k,r.ci);else SFX.miss();return}
  const z=e.target.closest('[data-car]');
  if(z){const c=e.target.closest('[data-ci]');tapTable(+z.dataset.car,c?+c.dataset.ci:null)}
  else if(screen==='game'&&game&&app.querySelector('.table')&&!e.target.closest('.over,input,button'))SFX.miss();
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.vol!==undefined){vol=t.value/100;LS.set('caravan_vol',vol);if(vol>0&&muted){muted=false;LS.set('caravan_mute',false)}applyVol();const v=document.getElementById('volv');if(v)v.textContent=Math.round(vol*100)+'%';return}
  if(t.dataset.nm){const n=getNames();n[t.dataset.nm]=t.value;LS.set('caravan_names',n)}
  else if(t.dataset.rng){
    const i=+t.dataset.rng;rnd[i]=+t.value;
    if(rnd[0]>rnd[1])rnd[1-i]=rnd[i];
    LS.set('caravan_rnd',rnd);
    document.getElementById('ra').textContent=rnd[0];document.getElementById('rb').textContent=rnd[1];
    app.querySelectorAll('[data-rng]').forEach(x=>{if(x!==t)x.value=rnd[+x.dataset.rng]});
  }
});
app.addEventListener('pointerover',e=>{
  if(e.pointerType!=='mouse')return;const b=e.target.closest('button[data-act]');
  if(!b||b.disabled){hovKey='';return}
  const k=b.dataset.act+'|'+(b.dataset.code||b.dataset.kind||b.dataset.b||b.dataset.c||''),now=Date.now();
  if(k===hovKey||now-hovT<90)return;hovKey=k;hovT=now;SFX.hover();
});
app.addEventListener('change',e=>{if(e.target.dataset.vol!==undefined){unlock();SFX.place();lastHtml=null;render()}});
let hotEl=null,hovRaf=0;
function coolCard(c){
  if(!c)return;c.classList.remove('hot');for(const v of ['--hy','--hx','--lz','--ly','--ox','--oy'])c.style.removeProperty(v);
  for(const n of [c.previousElementSibling,c.nextElementSibling])if(n&&n.style){n.style.removeProperty('--nx');n.style.removeProperty('--hy')}
}
app.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||(drag&&drag.on))return;
  if(use3d){const onTable=!!e.target.closest('.t3d'),x=onTable?e.clientX:-1,y=e.clientY;if(!hovRaf)hovRaf=requestAnimationFrame(()=>{hovRaf=0;GL.hover(x,y)})}
  const c=e.target.closest('.hc');
  if(hotEl&&hotEl!==c){coolCard(hotEl);hotEl=null}
  if(!c)return;
  hotEl=c;const px=Math.max(-1,Math.min(1,(e.offsetX/c.offsetWidth-.5)*2)),py=Math.max(-1,Math.min(1,(e.offsetY/c.offsetHeight-.5)*2)),st2=c.style;
  c.classList.add('hot');st2.setProperty('--hy',(px*16).toFixed(1)+'deg');st2.setProperty('--hx',(-py*13).toFixed(1)+'deg');st2.setProperty('--lz','34px');st2.setProperty('--ly','-10px');st2.setProperty('--ox',(50-px*34).toFixed(0)+'%');st2.setProperty('--oy',(50-py*34).toFixed(0)+'%');
  [c.previousElementSibling,c.nextElementSibling].forEach((n,i)=>{if(n&&n.classList&&n.classList.contains('hc')){n.style.setProperty('--nx',(i?9:-9)+'px');n.style.setProperty('--hy',(i?-7:7)+'deg')}});
});
app.addEventListener('pointerleave',()=>{coolCard(hotEl);hotEl=null;if(use3d)GL.hover(-1,-1)});
load3d();
init();
